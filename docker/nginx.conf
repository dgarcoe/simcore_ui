map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://simcore:8420;
    proxy_set_header Host $host;
    # Simcore limits logins and joins per address: tell it who is really asking.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Post-mortem narratives call the LLM and can take a while.
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://simcore:8420;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # GET /ollama/api/tags → installed models (written by 40-ollama-proxy.sh)
  include /etc/nginx/ollama.inc;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
