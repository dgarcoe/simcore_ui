      effects:
        items: {"location:Las Torres": {dinamita: 2}}

agents:
  # Los Motoristas
  - {name: Toro, age: 41, profession: mecánico, starting_location: El Taller, faction: Los Motoristas,
     backstory: "Fue mecánico de motos de carreras hasta que una apuesta amañada le costó la licencia y le dejó una cicatriz en la ceja. Montó Los Motoristas con los chavales del taller y les enseñó que en Los SIAntos solo se respeta a quien no se echa atrás. El viejo jefe le prometió El Polígono y nunca cumplió: ahora piensa cobrárselo.",
     goals: [Que Los Motoristas manden en la ciudad, Quedarse con El Polígono y su desguace, Que nadie vuelva a tomarle el pelo],
     attributes: {strength: 15, dexterity: 11, constitution: 14, intelligence: 9, wisdom: 10, charisma: 13},
     skills: [athletics, intimidation], resources: {bate: 1, dinero: 2},
     personality: {extraversion: 0.7, agreeableness: 0.3, neuroticism: 0.4},
     orders: {style: agresivo, priorities: [que gane mi banda, ser la leyenda], risk: bold,
              red_lines: [{action: attack, target: my_group}, {action: leave}],
              plans: [{when: {group_territories: {lte: 1}}, then: "Reúne a la banda y tomad El Polígono"}]}}
  - {name: Chispa, age: 24, profession: mecánica, starting_location: El Taller, faction: Los Motoristas,
     backstory: "Se crio entre motores y sabe arrancar cualquier coche en diez segundos. Es la más rápida de la banda y la que menos habla. Quiere que su nombre se cuente en los bares antes que el de Toro, aunque nunca se lo diría a la cara.",
     goals: [Ser la leyenda de Los SIAntos, Que nadie toque su moto, Encontrar el maletín antes que nadie y desaparecer con él un día entero],
     attributes: {strength: 11, dexterity: 15, constitution: 11, intelligence: 12, wisdom: 10, charisma: 11},
     skills: [stealth, sleight_of_hand], resources: {dinero: 1},
     orders: {style: sigiloso, priorities: [ser la leyenda, que gane mi banda], risk: careful,
              plans: [{when: {carries: maletin}, then: "Escóndete en Las Torres con el maletín"}]}}
  - {name: Grasa, age: 33, profession: conductor, starting_location: El Puerto, faction: Los Motoristas,
     backstory: "Conductor de grúa de día y de lo que haga falta de noche. Lleva diez años haciendo los trabajos sucios de Toro sin quejarse y está harto de ser el segundón. Cuenta cada billete y sabe a quién le debe cuánto.",
     goals: [Ganar dinero con los encargos de mercancía, Que Toro le haga su mano derecha, Retirarse antes de los cuarenta],
     attributes: {strength: 12, dexterity: 12, constitution: 13, intelligence: 11, wisdom: 11, charisma: 10},
     skills: [athletics, perception],
     orders: {style: empresario, priorities: [ganar dinero, que gane mi banda], risk: careful}}
  - {name: Lupe, age: 29, profession: sanitaria, starting_location: Las Torres, faction: Los Motoristas,
     backstory: "Sanitaria del turno de noche del Hospital, conoce a todos los heridos de la ciudad por su nombre. Entró en Los Motoristas por su hermano pequeño y se quedó para que nadie de la banda se desangrara en una esquina. Lleva siempre un botiquín y odia a los chivatos.",
     goals: [Que nadie de su banda se quede tirado, Ser respetada sin tener que pegar a nadie, Sacar a su hermano de la calle cuando acabe la guerra],
     attributes: {strength: 10, dexterity: 11, constitution: 12, intelligence: 13, wisdom: 14, charisma: 11},
     skills: [medicine, insight], resources: {botiquin: 1},
     orders: {style: leal, priorities: [que gane mi banda, no caer nunca], risk: careful,
              red_lines: [{action: chivarse}]}}
  # Los del Puerto
  - {name: Marea, age: 45, profession: estibadora, starting_location: El Puerto, faction: Los del Puerto,
     backstory: "Lleva veinte años descargando barcos y sabe qué contenedor viene vacío y cuál no. Es la que manda en El Puerto desde que el viejo jefe se jubiló, aunque nadie lo haya firmado. Habla poco, paga a tiempo y no perdona una traición.",
     goals: [Que todo lo que entra por mar pase por ella, Que Los del Puerto ganen la guerra, Descubrir quién de los suyos habla con la policía],
     attributes: {strength: 14, dexterity: 10, constitution: 14, intelligence: 12, wisdom: 12, charisma: 13},
     skills: [intimidation, athletics], resources: {bate: 1, mercancia: 2},
     orders: {style: leal, priorities: [que gane mi banda], risk: bold, red_lines: [{action: leave}]}}
  - {name: Ancla, age: 38, profession: estibador, starting_location: El Puerto, faction: Los del Puerto,
     backstory: "Estibador con brazos como amarras y paciencia corta. Hace años Toro le rompió la nariz en una pelea por una carga de piezas y todavía respira mal. Es leal a Marea hasta la muerte, pero su guerra es personal.",
     goals: [Proteger El Puerto de cualquiera que se acerque, Vengarse de Toro y tumbarlo delante de su banda, Que Marea le confíe el próximo cargamento],
     attributes: {strength: 16, dexterity: 9, constitution: 15, intelligence: 9, wisdom: 10, charisma: 9},
     skills: [athletics, intimidation],
     relationships: {Toro: {type: enemigo, sentiment: -0.6}},
     orders: {style: agresivo, priorities: [que gane mi banda], risk: reckless}}
  - {name: Rata, age: 22, profession: ratero, starting_location: El Mercado, faction: Los del Puerto,
     backstory: "Ratero desde los doce años, rápido de manos y de lengua. La policía le pilló hace meses y desde entonces les pasa información para que le dejen en paz; si su banda se entera, está acabado. Sobrevive cambiando de amigos según sople el viento.",
     goals: [Ser la leyenda de Los SIAntos sin que nadie sepa cómo, No volver a pisar la comisaría, Que nunca se descubra su secreto],
     attributes: {strength: 9, dexterity: 16, constitution: 10, intelligence: 13, wisdom: 12, charisma: 10},
     skills: [sleight_of_hand, stealth], secrets: [Habla con la policía a cambio de que le dejen en paz],
     orders: {style: oportunista, priorities: [ser la leyenda, no caer nunca], risk: careful,
              plans: [{when: {day: 3, group_rank: {gte: 3}}, then: "Deja a Los del Puerto y únete a la banda que vaya primera"}]}}
  - {name: Sirena, age: 31, profession: contrabandista, starting_location: Las Afueras, faction: Los del Puerto,
     backstory: "Contrabandista de guante blanco: mueve cajas entre el puerto y Las Afueras y nunca se mancha las manos. Sueña con un último gran negocio que la saque de la ciudad. Cree que Marea la subestima y quiere demostrarle lo contrario.",
     goals: [Hacer el negocio de su vida en Las Afueras, Que Marea confíe en ella, Tener más dinero que nadie de su banda],
     attributes: {strength: 10, dexterity: 13, constitution: 11, intelligence: 14, wisdom: 12, charisma: 14},
     skills: [persuasion, deception],
     orders: {style: negociador, priorities: [ganar dinero, que gane mi banda], risk: careful}}
  # La Familia
  - {name: Don Paco, age: 62, profession: dueño de un bar, starting_location: El Mercado, faction: La Familia,
     backstory: "Dueño del bar del Mercado y mano derecha del viejo jefe durante treinta años. Sabe dónde está enterrado cada secreto de la ciudad, a veces literalmente. Está convencido de que a su amigo lo tumbó alguien de dentro y no descansará hasta saber quién.",
     goals: [Que La Familia vuelva a mandar como antes, Encontrar a quien tumbó al viejo jefe, Mantener la paz en El Mercado pase lo que pase],
     attributes: {strength: 9, dexterity: 9, constitution: 10, intelligence: 15, wisdom: 15, charisma: 16},
     skills: [persuasion, insight], resources: {dinero: 6},
     orders: {style: negociador, priorities: [que gane mi banda], risk: careful, red_lines: [{action: chivarse}]}}
  - {name: Nena, age: 27, profession: camarera, starting_location: El Club, faction: La Familia,
     backstory: "Camarera en El Club y ahijada de Don Paco. Escucha todo lo que se dice en la barra y lo apunta en una libreta. Está cansada de que la vean como la niña de la Familia y quiere un nombre propio.",
     goals: [Ser la leyenda de Los SIAntos, Que Don Paco la respete como a una igual, Robarle algo a cada banda sin que se den cuenta],
     attributes: {strength: 11, dexterity: 14, constitution: 11, intelligence: 12, wisdom: 11, charisma: 13},
     skills: [stealth, deception],
     orders: {style: sigiloso, priorities: [ser la leyenda], risk: bold}}
  - {name: Tito, age: 35, profession: portero de discoteca, starting_location: El Club, faction: La Familia,
     backstory: "Portero de El Club desde que tiene memoria. No deja pasar a nadie sin permiso y ha tumbado a más gente de la que puede contar. Le debe la vida a Abuela Rosa, que le sacó de un lío de deudas, y haría cualquier cosa por La Familia.",
     goals: [Que nadie entre en El Club sin permiso, Ganar respeto tumbando a quien amenace a la Familia, Proteger a Abuela Rosa],
     attributes: {strength: 15, dexterity: 10, constitution: 15, intelligence: 9, wisdom: 11, charisma: 10},
     skills: [athletics, intimidation], resources: {bate: 1},
     orders: {style: leal, priorities: [que gane mi banda], risk: bold, red_lines: [{action: attack, target: my_group}]}}
  - {name: Abuela Rosa, age: 74, profession: prestamista, starting_location: Las Torres, faction: La Familia,
     backstory: "Presta dinero en Las Torres desde antes de que existieran las bandas. Media ciudad le debe algo y la otra media le debe algo a alguien que le debe algo a ella. Parece una abuelita inofensiva, y precisamente por eso nadie la ve venir.",
     goals: [Que todo el barrio le deba dinero, Que La Familia gane sin manchar su nombre, Cobrar las deudas del viejo jefe antes que nadie],
     attributes: {strength: 7, dexterity: 9, constitution: 9, intelligence: 16, wisdom: 16, charisma: 14},
     skills: [insight, persuasion], resources: {dinero: 8},
     orders: {style: empresario, priorities: [ganar dinero, que gane mi banda], risk: careful}}
  # Los Niños Bien
  - {name: Borja, age: 26, profession: heredero, starting_location: El Paseo, faction: Los Niños Bien,
     backstory: "Heredero de una constructora que quiere levantar torres de lujo donde hoy están los barrios. Su padre le dio un año para demostrar que vale; él ha decidido demostrarlo comprando la ciudad a billetazos. Cree que todo tiene precio, incluidos los enemigos.",
     goals: [Comprar la ciudad barrio a barrio, Que papá esté orgulloso, Sobornar a quien haga falta antes de pelear],
     attributes: {strength: 10, dexterity: 11, constitution: 11, intelligence: 12, wisdom: 9, charisma: 15},
     skills: [persuasion, intimidation], resources: {dinero: 10},
     orders: {style: negociador, priorities: [que gane mi banda, ser la leyenda], risk: bold}}
  - {name: Cayetana, age: 24, profession: influencer, starting_location: El Paseo, faction: Los Niños Bien,
     backstory: "Influencer con un millón de seguidores que ha descubierto que la guerra de bandas da muchas visitas. Lo graba todo, sobre todo lo que no debería. Quiere ser la cara de Los SIAntos y no le importa de qué banda sea al final.",
     goals: [Ser la leyenda de Los SIAntos, Grabarlo todo y hacerse viral, Estar donde estalle la próxima bronca],
     attributes: {strength: 9, dexterity: 13, constitution: 10, intelligence: 13, wisdom: 12, charisma: 16},
     skills: [deception, persuasion],
     orders: {style: oportunista, priorities: [ser la leyenda], risk: bold,
              plans: [{when: {my_rank: {lte: 3}}, then: "Haz pintadas en todos los barrios y que se vea"}]}}
  - {name: Íñigo, age: 28, profession: boxeador amateur, starting_location: El Paseo, faction: Los Niños Bien,
     backstory: "Boxeador amateur que dejó la universidad para entrenar. Harto de que le llamen niño bien en el gimnasio, quiere que la calle le respete a puñetazos. Es el músculo de su banda y lo sabe.",
     goals: [Demostrar que no es solo un niño bien, Que Los Niños Bien ganen, Tumbar a Ancla en una pelea limpia],
     attributes: {strength: 15, dexterity: 13, constitution: 13, intelligence: 10, wisdom: 9, charisma: 11},
     skills: [athletics, intimidation],
     orders: {style: agresivo, priorities: [que gane mi banda], risk: reckless}}
  - {name: Pipo, age: 23, profession: estudiante, starting_location: El Club, faction: Los Niños Bien,
     backstory: "Estudiante de Económicas que vende lo que haga falta en las fiestas del Club. Se metió en Los Niños Bien por un favor a Borja y ahora no sabe cómo salir. Su madre cree que está en la biblioteca.",
     goals: [Que no se entere su madre, Ganar dinero rápido y pagar la matrícula, Salir de la guerra sin un rasguño],
     attributes: {strength: 9, dexterity: 12, constitution: 10, intelligence: 14, wisdom: 11, charisma: 12},
     skills: [stealth, investigation],
     orders: {style: empresario, priorities: [ganar dinero, no caer nunca], risk: careful}}
