     attributes: {strength: 11, dexterity: 14, constitution: 11, intelligence: 12, wisdom: 11, charisma: 13},
     skills: [stealth, deception],
     orders: {style: sigiloso, priorities: [ser la leyenda], risk: bold}}
  - {name: Tito, age: 35, profession: portero de discoteca, starting_location: El Club, faction: La Familia,
     goals: [Que nadie entre en El Club sin permiso, Ganar respeto],
     attributes: {strength: 15, dexterity: 10, constitution: 15, intelligence: 9, wisdom: 11, charisma: 10},
     skills: [athletics, intimidation], resources: {bate: 1},
     orders: {style: leal, priorities: [que gane mi banda], risk: bold, red_lines: [{action: attack, target: my_group}]}}
  - {name: Abuela Rosa, age: 74, profession: prestamista, starting_location: Las Torres, faction: La Familia,
     goals: [Que todo el barrio le deba dinero, Que La Familia gane],
     attributes: {strength: 7, dexterity: 9, constitution: 9, intelligence: 16, wisdom: 16, charisma: 14},
     skills: [insight, persuasion], resources: {dinero: 8},
