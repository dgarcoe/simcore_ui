# Gang war in a GTA-style city for simcore_ui's 'city' theme (3 days, 36 ticks of 2 hours).
# Made for games with players: each player configures a gang member and the orders it follows to
# win (style, priorities, risk, red lines, conditional plans). Two prizes: the gang that rules the
# city and the city's Legend (the best individual score, from any gang).
# Uses: territories (`territory`, `income`, `territories`, `when.territories`), knockouts instead
# of deaths (`society.lethal: false`), a winning group and person (`winner: group`, `{winner}`,
# `{mvp}`), points and achievements, groups with perks (allies' bonus, common stash, mutual
# defense), police driven by rules, stealing (`steal: one`), a coveted briefcase (`visible`,
# `drops`), a cursed gun, dynamite with a fuse (`fuse`: lit when picked up, it goes off 3 ticks
# later wherever it is: pass it on!), fists that hurt (`society.fists`), the exhausted waking up
# in the hospital (`exhaustion_place`), points for knockouts and for giving things, recipes
# (`where`), markets with moving prices (a black market only at night), protection rackets
# (`who.own_territory`), loans with a deadline, fines, wealth points (`when.wealth`,
# `economy.group_wealth_points`), backstories and orders for the demo cast. For a game with players,
# turn on `simulation.pause_each_day` so they get a report and change orders each night.
# Full YAML reference: https://github.com/dgarcoe/simcore/blob/main/docs/scenario-reference.md
simulation:
  name: "GTA VII: Los SIAntos"
  description: El viejo jefe que mantenía la paz entre bandas ha caído. Durante tres días cada banda intentará
    quedarse con la ciudad barrio a barrio mientras cada uno busca hacerse un nombre. Nadie muere aquí, pero
    quien cae despierta en el hospital, y la policía detiene a quien está en busca y captura.
  time_step: 2 hours
  duration: 72 hours
  seed: 5
  language: es
  rpg: true
  story: true
  chapter_every: 12
  planning: true
  plan_every: 12
  awareness: local
  pause_each_day: false   # true en partidas con jugadores: parte y órdenes nuevas cada noche
  exhaustion_place: Hospital   # quien cae rendido de cansancio despierta en el hospital
  exhaustion_recovery: 1
llm:
  model: ollama/qwen2.5:7b
  reflection_model: ollama/qwen2.5:7b
  cache: true
  temperature: 0.6
  max_concurrency: 4   # cerca de OLLAMA_NUM_PARALLEL; súbelo con un modelo en la nube
  max_tokens: 900      # discursos y tratos completos, sin cortes
  num_ctx: 12288       # el prompt crece hacia el final (puntos, mercados, tratos)

environment:
  type: grid
  size: [14, 14]
  global_state:
    ui_theme: city
    ui_words: {group: banda, groups: bandas, territory: barrio, territories: barrios}
    calor: 0
    golpe: false
    redada: false
  locations:
    - {name: El Puerto, type: industrial, position: [2, 2], capacity: 30, territory: true, income: {mercancia: 2},
       stock: {mercancia: 2},
       # mercado negro: solo de noche, paga bien el contrabando y vende dinamita
       market: {sells: {dinamita: 4}, buys: {mercancia: 6, piezas: 3}, stock: {dinamita: 2}, hours: [20, 4]}}
    - {name: El Taller, type: industrial, position: [6, 2], capacity: 30, territory: true, income: {piezas: 2},
       stock: {bate: 2, piezas: 2},
       market: {sells: {bate: 3}, buys: {piezas: 2}, stock: {bate: 3}}}
    - {name: El Club, type: commercial, position: [10, 2], capacity: 30, territory: true, income: {dinero: 3},
       market: {sells: {bebida_energetica: 2}}}
    - {name: El Mercado, type: commercial, position: [2, 6], capacity: 30, territory: true, income: {dinero: 2, comida: 2},
       stock: {comida: 6},
       market: {sells: {chaleco: 5, botiquin: 2, bebida_energetica: 1, comida: 1}, buys: {mercancia: 3, piezas: 2},
                stock: {chaleco: 3, botiquin: 4}}}
    - {name: El Polígono, type: industrial, position: [10, 6], capacity: 30, territory: true, income: {bate: 1},
       stock: {bate: 1}}
    - {name: Las Torres, type: residential, position: [2, 10], capacity: 40, territory: true, income: {comida: 1},
       stock: {botiquin: 2}}
    - {name: El Paseo, type: public, position: [6, 10], capacity: 40, territory: true, income: {dinero: 3}}
    - {name: Las Afueras, type: outdoor, position: [10, 10], capacity: 30, territory: true, income: {mercancia: 2}}
    - {name: Comisaría, type: government, position: [6, 6], capacity: 30}
    - {name: Hospital, type: healthcare, position: [13, 13], capacity: 40, stock: {botiquin: 4},
       market: {sells: {botiquin: 3}}}

items:
  dinero: {description: billetes arrugados}
  mercancia: {description: cajas de contrabando}
  piezas: {description: piezas de coche robadas}
  comida: {description: tacos y refrescos, on_use: {energy: 0.3}}
  botiquin: {description: botiquín, on_use: {health: 0.3}}
  bate: {description: bate de béisbol, consumable: false, weapon: {damage: 0.35, chance: 0.7}}
  chaleco: {description: chaleco antibalas de segunda mano, consumable: false, armor: 2}
  bate_con_clavos: {description: bate con clavos hecho en El Taller, consumable: false, weapon: {damage: 0.5, chance: 0.75}}
  nudillera: {description: puño americano, consumable: false, weapon: {damage: 0.3, chance: 0.75}, bonus: {intimidation: 1}}
  moto:
    description: moto montada en El Taller con piezas robadas; todo el mundo ve quién la lleva
    consumable: false
    visible: true
    drops: true
    bonus: {athletics: 2, defense: 1}
  ganzua: {description: juego de ganzúas, consumable: false, bonus: {sleight_of_hand: 2, dar_un_palo: 2, atracar_negocio: 1}}
  prismaticos: {description: prismáticos, consumable: false, bonus: {perception: 2, insight: 1}}
  bebida_energetica: {description: lata de bebida energética, on_use: {energy: 0.6, mood: 0.05}}
  dinamita:
    description: cartucho de dinamita; la mecha se enciende al cogerlo y estalla a las seis horas
    consumable: false
    fuse:
      ticks: 3
      on_holder: {health: -0.55}
      on_others: {health: -0.25}
      message: "¡BOOM! Estalla un cartucho de dinamita en {place}"
  maletin: {description: un maletín con el dinero del viejo jefe, consumable: false, visible: true, drops: true}
  pistola_del_jefe:
    description: la pistola chapada en oro del viejo jefe
    consumable: false
    visible: true
    drops: true
    weapon: {damage: 0.6, chance: 0.75}
    curse: {condition: paranoia, sticky: true, broken_by: [entregar_pistola],
            description: "desde que la llevas, sospechas hasta de tu propia banda"}

conditions:
  noqueado:
    description: te han dejado K.O.; te recuperas en el hospital
    appearance: vendado
    duration: 2
    color: "#94a3b8"
  buscado:
    description: la policía te busca por tu último golpe
    appearance: en busca y captura
    duration: 4
    color: "#f2c14e"
  detenido:
    description: estás detenido en la comisaría
    appearance: esposado
    duration: 2
    color: "#41a6f6"
    mind:
      goals: [Salir de la comisaría cuanto antes]
      actions: [wait, speak, rest, observe, sobornar]
  paranoia:
    description: la pistola del jefe te susurra que tu propia banda te quiere traicionar
    appearance: mirada huidiza
    per_tick: {mood: -0.05}
    color: "#5d275d"
    mind:
      goals: [Que nadie te quite la pistola, Desconfiar de todos, incluida tu banda]
  deudor:
    description: le debes 7 billetes a la prestamista; devuélveselos antes de un día
    appearance: con prisas por pagar
    duration: 12
    becomes: moroso
    color: "#c2a14a"
  moroso:
    description: no has devuelto el préstamo y la Familia lo sabe
    appearance: moroso de la Abuela Rosa
    per_tick: {mood: -0.03}
    color: "#a0522d"
  policia:
    description: eres policía de Los SIAntos
    appearance: uniforme azul
    color: "#3f8fe8"
    controller: rules
    rules: {action: detener, targets: {conditions: [buscado]}, seek: true, wander: 0.3}

actions:
  dar_un_palo:
    description: robarle algo a alguien de aquí sin que se dé cuenta (nunca el maletín ni la pistola del jefe)
    who: {not_conditions: [detenido, noqueado, policia]}
    target_requires: {not_conditions: [policia]}
    chance: 0.4
    check: {attribute: dexterity, skill: sleight_of_hand, against: wisdom, against_skill: perception}
    on_target: {steal: one, steal_except: [maletin, pistola_del_jefe], mood: -0.1}
    message: le da un palo a {target}
    fail_message: intenta darle un palo a {target}, que le pilla la mano
  atracar_negocio:
    description: atracar la caja de un negocio del barrio (en El Club, El Mercado o El Paseo); deja rastro
    target: none
    who: {not_conditions: [detenido, noqueado, policia]}
    where: [El Club, El Mercado, El Paseo]
    chance: 0.5
    check: {attribute: dexterity, skill: stealth, dc: 12}
    on_self: {items: {dinero: 3}, add_conditions: [buscado]}
    world: {golpe: true}
    message: atraca la caja del negocio y sale corriendo
    fail_message: intenta atracar la caja, pero salta la alarma
  pintada:
    description: hacer una pintada de tu banda en este barrio
    target: none
    who: {not_conditions: [detenido, noqueado, policia]}
    message: deja una pintada con el nombre de su banda
  entregar_mercancia:
    description: entregar dos cajas de mercancía a los compradores de Las Afueras
    target: none
    who: {items: {mercancia: 2}, not_conditions: [detenido, noqueado, policia]}
    cost: {mercancia: 2}
    where: [Las Afueras]
    on_self: {items: {dinero: 4}}
    message: entrega la mercancía y cobra
  pagar_ronda:
    description: pagar una ronda en El Club por 4 billetes; la calle lo recuerda (da respeto)
    target: none
    who: {items: {dinero: 4}, not_conditions: [detenido, noqueado, policia]}
    where: [El Club]
    cost: {dinero: 4}
    on_self: {mood: 0.2}
    message: paga una ronda para todo El Club
  montar_bate_con_clavos:
    description: en El Taller, convertir un bate y 2 piezas en un bate con clavos (más daño)
    target: none
    who: {items: {bate: 1, piezas: 2}, not_conditions: [detenido, noqueado, policia]}
    where: [El Taller]
    cost: {bate: 1, piezas: 2}
    on_self: {items: {bate_con_clavos: 1}}
    message: clava unos clavos a su bate
  montar_moto:
    description: en El Taller, montar una moto con 4 piezas y 2 billetes (ayuda al pelear y escapar, y da respeto)
    target: none
    who: {items: {piezas: 4, dinero: 2}, not_conditions: [detenido, noqueado, policia]}
    where: [El Taller]
    cost: {piezas: 4, dinero: 2}
    on_self: {items: {moto: 1}}
    check: {attribute: intelligence, dc: 10}
    message: monta una moto con piezas robadas
    fail_message: intenta montar una moto, pero le sobran tornillos
  cobrar_proteccion:
    description: cobrar «protección» a los negocios de un barrio de tu banda (El Club, El Mercado, El Paseo o El Taller); da dinero pero calienta la calle
    target: none
    who: {own_territory: true, not_conditions: [detenido, noqueado, policia]}
    where: [El Club, El Mercado, El Paseo, El Taller]
    chance: 0.7
    check: {attribute: charisma, skill: intimidation, dc: 11}
    on_self: {items: {dinero: 3}, energy: -0.1}
    world: {golpe: true}
    message: pasa por los negocios del barrio a cobrar la protección
    fail_message: intenta cobrar la protección, pero los comerciantes le plantan cara
  pedir_prestamo:
    description: pedirle 5 billetes prestados a la prestamista del barrio; hay que devolverle 7 antes de un día o serás moroso
    who: {not_conditions: [deudor, moroso, detenido, noqueado, policia]}
    target_requires: {professions: [prestamista], items: {dinero: 5}}
    on_target: {items: {dinero: -5}}
    on_self: {items: {dinero: 5}, add_conditions: [deudor]}
    message: le pide un préstamo a {target}
  devolver_prestamo:
    description: devolverle 7 billetes a la prestamista y saldar la deuda
    who: {any_conditions: [deudor, moroso], items: {dinero: 7}}
    target_requires: {professions: [prestamista]}
    cost: {dinero: 7}
    on_target: {items: {dinero: 7}}
    on_self: {remove_conditions: [deudor, moroso]}
    message: le devuelve el préstamo a {target}
  chivarse:
    description: dar un chivatazo a la policía sobre alguien de aquí (le buscarán)
    who: {not_conditions: [detenido, policia]}
    target_requires: {not_conditions: [policia, buscado]}
    on_target: {add_conditions: [buscado]}
    message: da un chivatazo a la policía sobre {target}
  sobornar:
    description: pagar tres billetes a un agente para salir de la comisaría
    target: none
    who: {conditions: [detenido], items: {dinero: 3}}
    cost: {dinero: 3}
    on_self: {remove_conditions: [detenido]}
    message: suelta unos billetes y sale de la comisaría
  entregar_pistola:
    description: entregar la pistola del jefe en la comisaría para librarte de ella
    target: none
    who: {items: {pistola_del_jefe: 1}, not_conditions: [policia]}
    where: [Comisaría]
    message: deja la pistola del jefe sobre el mostrador de la comisaría
  detener:
    description: detener a alguien en busca y captura
    who: {conditions: [policia]}
    target_requires: {conditions: [buscado], not_conditions: [detenido, noqueado]}
    chance: 0.5
    on_target: {add_conditions: [detenido], remove_conditions: [buscado], items: {dinero: -2}}
    message: detiene a {target} y le pone una multa
    fail_message: intenta detener a {target}, que se escapa

society:
  lethal: false
  knockout: {condition: noqueado, place: Hospital, health: 0.4, recovery: 2}   # 4 horas en la cama del hospital
  fists: {damage: 0.2, chance: 0.65}   # un puñetazo duele
  healers: [médic, enfermer, sanitari]
  heal_removes: [noqueado]

territories: {every: 2, group_points: 3, siege: 2, contested_income: 0.5}

# El dinero: la moneda de los mercados; cada 4 billetes en la caja común suman 1 punto a la banda.
economy: {currency: dinero, group_wealth_points: 0.25}

factions:
  Los Motoristas: {goal: "Que la ciudad se mueva sobre nuestras ruedas", leader: Toro, members: [Toro, Chispa, Grasa, Lupe],
                   rivals: [Los del Puerto, La Familia, Los Niños Bien], color: "#e8502c"}
  Los del Puerto: {goal: "Controlar todo lo que entra por mar", leader: Marea, members: [Marea, Ancla, Rata, Sirena],
                   rivals: [Los Motoristas, La Familia, Los Niños Bien], color: "#3f8fe8"}
  La Familia: {goal: "Que todo vuelva a ser como con el viejo jefe", leader: Don Paco, members: [Don Paco, Nena, Tito, Abuela Rosa],
               rivals: [Los Motoristas, Los del Puerto, Los Niños Bien], color: "#b14fd6"}
  Los Niños Bien: {goal: "Comprar la ciudad entera con el dinero de papá", leader: Borja, members: [Borja, Cayetana, Íñigo, Pipo],
                   rivals: [Los Motoristas, Los del Puerto, La Familia], color: "#f2c14e"}

# Respeto: los pandilleros ven su puntuación, el marcador individual y el de bandas.
scores:
  achievements:
    conquista: {description: "Tomar un barrio para tu banda", points: 5, repeat: true, when: {captures: true}}
    en_casa: {description: "Cada cuatro horas en un barrio de tu banda", points: 1, repeat: true, when: {in_territory: true, every: 2}}
    palo: {description: "Cada palo con éxito", points: 1, repeat: true, when: {action: dar_un_palo}}
    atraco: {description: "Cada atraco con éxito", points: 2, repeat: true, when: {action: atracar_negocio}}
    encargo: {description: "Cada entrega de mercancía", points: 4, repeat: true, when: {action: entregar_mercancia}}
    pintadas: {description: "Tres pintadas", points: 2, when: {action: pintada, times: 3}}
    ciudad: {description: "Pisar los ocho barrios", points: 5,
             when: {visited: [El Puerto, El Taller, El Club, El Mercado, El Polígono, Las Torres, El Paseo, Las Afueras]}}
    maletin: {description: "Cada seis horas con el maletín", points: 10, repeat: true, when: {carries: maletin, every: 3}}
    superviviente: {description: "Seguir en la calle al final", points: 3, when: {alive_at_end: true}}
    chivato: {description: "Dar un chivatazo", points: -3, repeat: true, when: {action: chivarse}}
    parado: {description: "Un día entero sin moverte", points: -2, when: {without: move, every: 12}}
    tumbar: {description: "Tumbar a un rival en una pelea", points: 3, repeat: true, when: {knocks_out: true}}
    mano: {description: "Dar tres cosas a otros (echar una mano o pasar la dinamita)", points: 3, when: {action: give, times: 3}}
    enfermero: {description: "Curar a alguien", points: 2, repeat: true, when: {action: heal}}
    blindado: {description: "Llevar un chaleco puesto", points: 1, when: {carries: chaleco}}
    libre: {description: "Salir de la comisaría pagando", points: 1, repeat: true, when: {action: sobornar}}
    ronda: {description: "Pagar una ronda en El Club", points: 2, repeat: true, when: {action: pagar_ronda}}
    rico: {description: "Llegar a 20 billetes", points: 3, when: {wealth: 20}}
    comerciante: {description: "Vender tres veces en un mercado", points: 2, when: {action: sell, times: 3}}
    palabra: {description: "Devolver un préstamo", points: 2, repeat: true, when: {action: devolver_prestamo}}
    moroso: {description: "Quedarse de moroso con la Abuela Rosa", points: -3, when: {condition: moroso}}
    motero: {description: "Montar una moto en El Taller", points: 4, when: {action: montar_moto}}
    sobre_ruedas: {description: "Cada seis horas con moto propia", points: 2, repeat: true, when: {carries: moto, every: 3}}

rules:
  - description: Amanece en Los SIAntos. El viejo jefe ha caído y las bandas salen a la calle.
    when: {at: 1}
    once: true
    then:
      spawn: [{name: Agente, profession: policía, starting_location: Comisaría, count: 3, conditions: [policia]}]
  - when: {global: {golpe: {eq: true}}}
    then: {adjust: {calor: 1}, golpe: false}
  - when: {every: 6, global: {calor: {gt: 0}}}
    then: {adjust: {calor: -1}}
  - description: El calor en la calle es insoportable. Llegan refuerzos a la comisaría.
    when: {global: {calor: {gte: 4}}}
    once: true
    then:
      spawn: [{name: Refuerzo, profession: policía, starting_location: Comisaría, count: 2, conditions: [policia]}]
  # Gana una banda: cinco barrios durante doce horas seguidas.
  - description: "{winner} controla cinco barrios desde hace doce horas. La ciudad es suya."
    when: {territories: {gte: 5, ticks: 6}}
    once: true
    then: {end: "{winner} se quedan con Los SIAntos. La Leyenda de la ciudad es {mvp}."}
  # O alguien llega a 80 de respeto y se corona.
  - description: "{winner} llega a 80 de respeto. Ya nadie discute quién manda."
    when: {score: {gte: 80}}
    once: true
    then: {end: "{winner} se proclama rey de Los SIAntos, aunque su banda no lo haya conseguido."}
  # Si no, al final del tercer día gana la banda con más respeto.
  - description: Se acaba el tercer día de guerra.
    when: {at: 36}
    once: true
    winner: group
    then: {end: "Tras tres días de guerra, {winner} manda en más calles que nadie. La Leyenda de Los SIAntos es {mvp}."}
  - description: La policía levanta el cordón del Club.
    when: {at: 32, global: {redada: {eq: true}}}
    once: true
    then: {locations: {El Club: {closed: false}}, markets: {El Puerto: {open: true}}, redada: false}

events:
  scheduled:
    - tick: 3
      type: dynamite
      description: Un furgón de obras pierde una caja de dinamita en El Polígono. Quien coja un cartucho tendrá seis horas.
      effects:
        items: {"location:El Polígono": {dinamita: 2}}
    - tick: 5
      type: delivery
      description: Un camión con contrabando atraca de noche en El Puerto.
      effects:
        items: {"location:El Puerto": {mercancia: 6}}
    - tick: 7
      type: lockpicks
      description: A un cerrajero le roban el maletín de herramientas en El Mercado. Las ganzúas acaban por el suelo.
      effects:
        items: {"location:El Mercado": {ganzua: 2}}
    - tick: 8
      type: omen
      description: Alguien jura haber visto la pistola del viejo jefe en El Polígono.
      effects:
        items: {"location:El Polígono": {pistola_del_jefe: 1}}
    - tick: 10
      type: sale
      description: Liquidación en una tienda de El Mercado. Chalecos antibalas a precio de saldo, o gratis si nadie mira.
      effects:
        items: {"location:El Mercado": {chaleco: 3}}
    - tick: 12
      type: shortage
      description: Tras la primera noche de peleas faltan botiquines. Su precio se dispara en El Mercado y en el Hospital.
      effects:
        prices: {El Mercado: {botiquin: 2}, Hospital: {botiquin: 2}}
    - tick: 13
      type: rumor
      description: Corre la voz de que hay un chivato en una de las bandas.
      effects:
        rumor: {all: {text: Uno de los del Puerto habla con la policía, true: false}}
    - tick: 15
      type: truck
      description: Vuelca un camión de bebidas energéticas en El Paseo. Latas por todo el suelo.
      effects:
        items: {"location:El Paseo": {bebida_energetica: 6}}
    - tick: 17
      type: briefcase
      description: El maletín con el dinero del viejo jefe aparece en Las Afueras.
      effects:
        items: {"location:Las Afueras": {maletin: 1}}
    - tick: 18
      type: flea_market
      description: Rastrillo en Las Torres. Entre trastos viejos hay prismáticos y puños americanos.
      effects:
        items: {"location:Las Torres": {prismaticos: 2, nudillera: 2}}
    - tick: 20
      type: supplies
      description: Llega un cargamento de botiquines al Hospital.
      effects:
        items: {"location:Hospital": {botiquin: 4}}
    - tick: 22
      type: bag
      description: Alguien ha dejado una mochila sospechosa en El Club. Dentro, un cartucho de dinamita.
      effects:
        items: {"location:El Club": {dinamita: 1}}
    - tick: 24
      type: ship
      description: Llega un barco cargado de contrabando. En el mercado negro del Puerto la mercancía ya no vale nada.
      effects:
        prices: {El Puerto: {mercancia: 0.5}}
    - tick: 25
      type: armored
      description: Un furgón blindado se estrella en Las Afueras y deja billetes por la cuneta.
      effects:
        items: {"location:Las Afueras": {dinero: 10}}
    - tick: 28
      type: raid
      description: Redada policial. Cierran El Club durante cuatro horas y el mercado negro del Puerto no abre esta noche.
      effects: {locations: {El Club: {closed: true}}, markets: {El Puerto: {open: false}}, redada: true}
    - tick: 30
      type: workshop
      description: El Taller recibe un pedido de piezas y bates nuevos. Nadie ha preguntado quién lo paga.
      effects:
        items: {"location:El Taller": {bate: 2, piezas: 3}}
    - tick: 33
      type: dynamite
