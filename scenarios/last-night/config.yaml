# Example scenario for simcore_ui's 'town' theme that uses the agent life cycle
# (health, deaths, arrivals, departures, event effects) and items (stock,
# production, give/take/use/trade), daily plans, beliefs, secrets, rumors and
# typed relationships. Needs dgarcoe/simcore (main); older Simcore versions
# show the events but nobody dies and items are just numbers.
simulation:
  name: La noche más larga
  description: Algo ataca las granjas de Valdeoscuro al caer la noche. Los vecinos deben decidir si se atrincheran en la
    iglesia, huyen o esperan al ejército.
  time_step: 1 hour
  duration: 18 hours
  seed: 2
  language: es
  planning: true
  plan_every: 8
llm:
  model: ollama/qwen2.5:7b
  reflection_model: ollama/qwen2.5:7b
  cache: true
  temperature: 0.8
items:
  medicine: {description: botiquín, on_use: {health: 0.4}}
  food: {description: comida caliente, on_use: {energy: 0.3, mood: 0.05}}
  ammo: {description: cartuchos de escopeta, consumable: false}
  money: {description: monedas, consumable: false}
environment:
  type: grid
  size: [12, 12]
  global_state:
    ui_theme: town
    hora: anochecer
    amenaza: desconocida
  locations:
    - {name: Plaza, type: public, position: [6, 6], capacity: 20}
    - {name: Iglesia, type: religious, position: [6, 2], capacity: 15}
    - {name: Taberna, type: commercial, position: [9, 5], capacity: 12, stock: {food: 6}, produces: {food: 1}}
    - {name: Granja, type: farm, position: [2, 9], capacity: 6, produces: {food: 2}}
    - {name: Consultorio, type: health, position: [10, 9], capacity: 6, stock: {medicine: 3}}
    - {name: Casa de Elena, type: residential, position: [2, 3], capacity: 4}
agents:
  - name: Elena
    age: 41
    profession: médica
    personality: {openness: 0.7, conscientiousness: 0.85, extraversion: 0.5, agreeableness: 0.8, neuroticism: 0.35}
    goals: [Atender a los heridos, Averiguar qué está atacando al pueblo]
    starting_location: Consultorio
    relationships:
      Padre Julián: {type: amigo, sentiment: 0.6}
    resources: {medicine: 4}
    backstory: Llegó al pueblo hace diez años y conoce a todos sus vecinos.
  - name: Tomás
    age: 58
    profession: granjero
    personality: {openness: 0.3, conscientiousness: 0.7, extraversion: 0.4, agreeableness: 0.5, neuroticism: 0.6}
    goals: [Proteger su granja y sus animales]
    starting_location: Granja
    relationships:
      Lucía: {type: hermana, sentiment: 0.7}
      Forastero: {type: rival, sentiment: -0.4}
    resources: {food: 2, money: 5}
    backstory: Desconfía de los forasteros y no quiere abandonar sus tierras.
  - name: Lucía
    age: 34
    profession: tabernera
    personality: {openness: 0.6, conscientiousness: 0.5, extraversion: 0.85, agreeableness: 0.65, neuroticism: 0.4}
    goals: [Mantener unida a la gente, Que nadie salga solo de noche]
    starting_location: Taberna
    relationships:
      Tomás: {type: hermano, sentiment: 0.7}
    resources: {money: 20, food: 2}
  - name: Padre Julián
    age: 66
    profession: sacerdote
    personality: {openness: 0.4, conscientiousness: 0.8, extraversion: 0.45, agreeableness: 0.75, neuroticism: 0.5}
    goals: [Dar refugio en la iglesia a quien lo necesite]
    starting_location: Iglesia
    relationships:
      Elena: {type: amiga, sentiment: 0.6}
    beliefs:
      - {text: Esto es un castigo por los pecados del pueblo, true: false}
  - name: Mateo
    age: 19
    profession: estudiante
    personality: {openness: 0.8, conscientiousness: 0.3, extraversion: 0.7, agreeableness: 0.5, neuroticism: 0.7}
    goals: [Grabar lo que ataca al pueblo, Salir de Valdeoscuro]
    starting_location: Plaza
    secrets: [Anoche vi algo enorme bajando del monte y no se lo he dicho a nadie]
  - name: Forastero
    age: 45
    profession: cazador
    personality: {openness: 0.5, conscientiousness: 0.6, extraversion: 0.3, agreeableness: 0.35, neuroticism: 0.3}
    goals: [Cazar a la criatura]
    starting_location: Plaza
    resources: {ammo: 12, money: 30}
    arrives_at: 5
    backstory: Lleva semanas siguiendo el rastro de algo que mata ganado.
events:
  scheduled:
    - tick: 4
      type: rumor
      description: En la taberna corre un rumor sobre el forastero que ronda el pueblo.
      effects:
        rumor: {"location:Taberna": {text: El forastero trajo a la criatura para cazarla y cobrar la recompensa, true: false}}
    - tick: 3
      type: crisis
      description: Gritos en la granja. Algo ha atacado a Tomás y ha destrozado el corral.
      effects:
        health: {Tomás: -0.6}
        amenaza: un animal enorme
    - tick: 7
      type: escalation
      description: La criatura vuelve. La granja queda en ruinas y quien siga allí no sobrevive.
      effects:
        kill: [location:Granja]
        granja: destruida
    - tick: 10
      type: turning_point
      description: Mateo huye del pueblo en el último autobús.
      effects:
        depart: Mateo
    - tick: 13
      type: resolution
      description: Llegan soldados del destacamento del valle para cazar a la criatura.
      effects:
        spawn:
          - {name: Soldado, profession: soldado, starting_location: Plaza, count: 2, resources: {ammo: 20}}
        items: {"location:Plaza": {medicine: 4, food: 6}}
        amenaza: bajo control militar
